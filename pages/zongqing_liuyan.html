<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宗亲留言</title>

<style>
body { font-family: Arial; background: #f5f5f5; padding: 20px; }
.container { max-width: 600px; margin: auto; background: #fff; padding: 20px; border-radius: 10px; }
h1 { text-align: center; }
label { display: block; margin-top: 15px; }
input, textarea, select { width: 100%; padding: 10px; margin-top: 5px; }
button { margin-top: 20px; width: 100%; padding: 12px; background: #007BFF; color: #fff; border: none; cursor:pointer; }
button:disabled { background: #aaa; }
</style>
</head>
<body>

<div class="container">
<h1>宗亲留言</h1>

<form id="form">

<label>留言类型</label>
<select name="type" required>
  <option value="">请选择</option>
  <option value="添加字辈">添加字辈</option>
  <option value="修改字辈">修改字辈</option>
  <option value="寻亲登记">寻亲登记</option>
</select>

<label>留言内容</label>
<textarea name="content" required></textarea>

<label>邮箱</label>
<input type="email" name="email" required>

<label>电话</label>
<input type="tel" name="phone" required>

<input type="text" name="website" style="display:none">

<label>验证码：<span id="captcha"></span></label>
<input type="text" id="captchaInput" required>

<button type="submit" id="submitBtn">提交</button>

</form>
</div>

<script>
const form = document.getElementById("form");
const captchaEl = document.getElementById("captcha");
const submitBtn = document.getElementById("submitBtn");

let captcha = generateCaptcha();
let cooldown = false;

function generateCaptcha() {
  const a = Math.floor(Math.random()*10);
  const b = Math.floor(Math.random()*10);
  const result = a + b;
  captchaEl.innerText = `${a} + ${b} = ?`;
  return result;
}

form.addEventListener("submit", async function(e){
  e.preventDefault();

  if (cooldown) {
    alert("请30秒后再提交");
    return;
  }

  if (form.website.value !== "") {
    alert("非法提交");
    return;
  }

  if (parseInt(document.getElementById("captchaInput").value) !== captcha) {
    alert("验证码错误");
    captcha = generateCaptcha();
    return;
  }

  submitBtn.disabled = true;
  cooldown = true;

  setTimeout(()=>{
    submitBtn.disabled = false;
    cooldown = false;
  },30000);

  try {
    const res = await fetch("https://zibeixinxiliuyan.271776169.workers.dev/", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        type: form.type.value,
        content: form.content.value,
        email: form.email.value,
        phone: form.phone.value
      })
    });

    // 关键：读取返回内容
    const text = await res.text();

    // 调试输出（一定要看这里）
    console.log("返回状态:", res.status);
    console.log("返回内容:", text);

    // 修正：必须同时满足才算成功
    if (res.ok && text.includes("id")) {
      alert("提交成功！");
      form.reset();
      captcha = generateCaptcha();
    } else {
      alert("发送失败：" + text);
    }

  } catch (err) {
    console.error("请求异常:", err);
    alert("网络错误，提交失败！");
  }
});
</script>

</body>
</html>
