<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>字辈信息示例</title>
    <link rel="stylesheet" href="../css/style.css">

</head>
<body class="all_zibei_page">

<h2>字辈信息示例</h2>

<table border="1" id="zibeiTable">
    <thead>
        <tr>
            <th>ID号</th>
            <th>聚居地</th>
            <th>字辈用字</th>
            <th>备注</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<script>
const limit = 2;

// ===== 高性能随机抽样函数 =====
function getRandomItems(arr, count) {
  const result = [];
  const used = new Set();
  const max = Math.min(count, arr.length);

  while (result.length < max) {
    const index = Math.floor(Math.random() * arr.length);
    if (!used.has(index)) {
      used.add(index);
      result.push(arr[index]);
    }
  }
  return result;
}

// ===== 加载 + 随机显示 =====
fetch('https://api.kongzhuanwang.site/zibeiyugaikuang.json?t=' + Date.now())
  .then(res => res.json())
  .then(data => {
    const tbody = document.querySelector('#zibeiTable tbody');
    tbody.innerHTML = '';

    const randomList = getRandomItems(data, limit);

    randomList.forEach(item => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${item.ID号 || ''}</td>
        <td>${item.聚居地 || ''}</td>
        <td>${item.字辈用字 || ''}</td>
        <td>${item.备注 || ''}</td>`;
      tbody.appendChild(tr);
    });
  // ⭐⭐⭐ 就是这里（forEach结束之后）
  sendHeight();
    if (randomList.length === 0) {
      tbody.innerHTML = '<tr><td colspan="4">暂无数据</td></tr>';
    }
  })
  .catch(err => {
    alert('失败：' + err.message);
  });
</script>
<script>
function sendHeight() {
  const height = document.body.scrollHeight;

  window.parent.postMessage({
    type: 'setHeight',
    height: height
  }, '*');
}
</script>
<script>
// ⭐ 兜底（放最后）
window.onload = function () {
  setTimeout(sendHeight, 100);
};
</script>
</body>
</html>
