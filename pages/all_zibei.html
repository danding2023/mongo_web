<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>字辈信息示例</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="all_zibei_page">

<h2>
  字辈信息示例
  <span id="loadTime" style="font-size:14px; color:#888; margin-left:10px;"></span>
</h2>

<table border="1" id="zibeiTable">
    <thead>
        <tr>
            <th>ID号</th>
            <th>聚居地</th>
            <th>字辈用字</th>
            <th>备注</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<script>
const limit = 2;

// ⭐ 开始计时
const startTime = performance.now();

// ⭐ 实时计时器（每100ms更新一次）
const timerEl = document.getElementById('loadTime');
const timer = setInterval(() => {
  const now = performance.now();
  const seconds = ((now - startTime) / 1000).toFixed(2);
  timerEl.innerText = `加载耗时：${seconds} 秒...`;
}, 100);

// ===== 高性能随机抽样函数 =====
function getRandomItems(arr, count) {
  const result = [];
  const used = new Set();
  const max = Math.min(count, arr.length);

  while (result.length < max) {
    const index = Math.floor(Math.random() * arr.length);
    if (!used.has(index)) {
      used.add(index);
      result.push(arr[index]);
    }
  }
  return result;
}

// ===== 加载 + 渲染 =====
fetch('https://allzibei.kongzhuanwang.site/?limit=2')
  .then(res => res.json())
  .then(data => {
    const tbody = document.querySelector('#zibeiTable tbody');
    tbody.innerHTML = '';

    const randomList = getRandomItems(data, limit);

    randomList.forEach(item => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${item.ID号 || ''}</td>
        <td>${item.聚居地 || ''}</td>
        <td>${item.字辈用字 || ''}</td>
        <td>${item.备注 || ''}</td>`;
      tbody.appendChild(tr);
    });

    sendHeight();

    // ⭐ 停止动态计时
    clearInterval(timer);

    // ⭐ 最终耗时
    const endTime = performance.now();
    const loadTime = ((endTime - startTime) / 1000).toFixed(2);
    timerEl.innerText = `加载耗时：${loadTime} 秒`;

    if (randomList.length === 0) {
      tbody.innerHTML = '<tr><td colspan="4">暂无数据</td></tr>';
    }
  })
  .catch(err => {
    clearInterval(timer); // 防止异常时一直跑
    timerEl.innerText = '加载失败';
    alert('失败：' + err.message);
  });
</script>

<script>
function sendHeight() {
  const height = document.body.scrollHeight;

  window.parent.postMessage({
    type: 'setHeight',
    height: height
  }, '*');
}
</script>

// ⭐ 页面加载后发送一次
window.onload = function () {
  setTimeout(sendHeight, 100);
};

// ⭐ 关键：持续同步高度（解决跨域问题）
setInterval(sendHeight, 500);
</script>



</body>
</html>
